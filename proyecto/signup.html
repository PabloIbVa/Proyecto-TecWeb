<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - BugWeb</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js" defer></script>
  <script src="js/validacion.js" defer></script>
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="signup-container">
    <h1>Registro</h1>

    <form action="Backend/myapi/Registro/process-signup.php" method="post" id="signup" novalidate>
      <div>
        <label for="name">Nombre de usuario:</label>
        <input type="text" id="name" name="name" placeholder="Coloca un nombre de usuario">
      </div>

      <div>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="Ingresa tu correo electrónico">
      </div>

      <div>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required placeholder="Crea una contraseña">
      </div>

      <div>
        <label for="confirm-password">Confirmar contraseña:</label>
        <input type="password" id="confirm-password" name="confirm-password" required placeholder="Repite tu contraseña">
      </div>
      
      <div class="button-wrapper">
        <button type="submit">Registrarse</button>
      </div>
    </form>
  </div>
</body>
</html>
